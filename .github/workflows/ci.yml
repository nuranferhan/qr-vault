name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. AŞAMA: Kod Analizi (Lint)
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Ruff Yükle ve Kontrol Et
      run: |
        pip install ruff
        ruff check src/ --exit-zero

  # 2. AŞAMA: API Test Katmanı (Unit & Integration)
  test:
    needs: lint
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:3.4.0
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
    - uses: actions/checkout@v4

    - name: Python Kurulumu (Rapordaki Sürümle Uyumlu)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Stabilite için CI environment sürümü

    - name: Bağımlılıkların Yüklenmesi
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn sqlalchemy psycopg2-binary alembic "qrcode[pil]" pillow boto3 prometheus-client pydantic python-multipart httpx
        pip install pytest pytest-cov testcontainers factory-boy faker

    - name: Host Ayarları (LocalStack için)
      run: sudo echo "127.0.0.1 localstack" | sudo tee -a /etc/hosts

    # Selin'in tüm test mimarisini izole olarak tetikleyen güvenli alan
    - name: Pytest ve Kod Kapsamı (Coverage) Kontrolü
      env:
        DATABASE_URL: "sqlite:///./qrvault_test.db"
        LOCALSTACK: "true"
        AWS_ACCESS_KEY_ID: mock_key
        AWS_SECRET_ACCESS_KEY: mock_secret
        AWS_DEFAULT_REGION: us-east-1
        AWS_ENDPOINT_URL: http://localhost:4566
        LOCALSTACK_URL: http://localhost:4566
      run: |
        pytest --cov=src --cov-fail-under=70 tests/

  # 3. AŞAMA: Docker Multi-stage Build & Paketleme
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Docker Buildx Kurulumu
      uses: docker/setup-buildx-action@v3

    - name: GitHub Container Registry Girişi
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker İmajını Oluştur ve Push Et
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/qrvault:latest
          ghcr.io/${{ github.repository }}/qrvault:${{ github.sha }}

  # 4. AŞAMA: Smoke Test (Uviorn Canlı Kaldırma Simülasyonu)
  smoke:
    needs: docker-build
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:3.4.0
        ports:
          - 4566:4566

    steps:
    - uses: actions/checkout@v4

    - name: Konfigürasyon Ayarları
      run: sudo echo "127.0.0.1 localstack" | sudo tee -a /etc/hosts

    - name: Paketlenen Docker İmajını Canlıya Al ve Port Bağla
      env:
        DATABASE_URL: "sqlite:///./qrvault.db"
        LOCALSTACK: "true"
        AWS_ACCESS_KEY_ID: mock_key
        AWS_SECRET_ACCESS_KEY: mock_secret
        AWS_DEFAULT_REGION: us-east-1
      run: |
        docker run -d --name qrvault_app --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e LOCALSTACK="$LOCALSTACK" \
          -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          -e AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION" \
          -e AWS_ENDPOINT_URL="http://localhost:4566" \
          ghcr.io/${{ github.repository }}/qrvault:latest

    - name: Entegrasyon Öncesi Canlı Sağlık Kontrolü
      run: |
        sleep 8
        curl -f http://127.0.0.1:8000/health || (docker logs qrvault_app && exit 1)

  # 5. AŞAMA: Newman Otomasyon Testleri
  newman:
    needs: smoke
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:3.4.0
        ports:
          - 4566:4566

    steps:
    - uses: actions/checkout@v4

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Newman CLI Kurulumu
      run: npm install -g newman

    - name: Docker Container'ı Üzerinden Newman Testlerini Koştur
      run: |
        sudo echo "127.0.0.1 localstack" | sudo tee -a /etc/hosts
        
        # Önceden smoke aşamasında docker üzerinde kalkan uygulamaya dışarıdan Newman ile vuruyoruz
        newman run postman/collection.json --env-var "baseUrl=http://127.0.0.1:8000" --ignore-redirects
