name: CI/CD Pipeline



on:

  push:

    branches: [ main, master ]

  pull_request:

    branches: [ main, master ]



jobs:

  # 1. AŞAMA: Kod Analizi (Lint)

  lint:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4



    - name: Python Kurulumu

      uses: actions/setup-python@v5

      with:

        python-version: '3.11'



    - name: Ruff Yükle ve Kontrol Et

      run: |

        pip install ruff

        ruff check src/ --exit-zero



  # 2. AŞAMA: API Test Katmanı (Selin testleri ekleyince buraya entegre edecek)

  test:

    needs: lint # Önce lint aşamasının bitmesini bekler

    runs-on: ubuntu-latest



    services:

      localstack:

        image: localstack/localstack:3.4.0

        ports:

          - 4566:4566

        options: >-

          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"

          --health-interval 10s

          --health-timeout 5s

          --health-retries 3



    steps:

    - uses: actions/checkout@v4



    - name: Python Kurulumu

      uses: actions/setup-python@v5

      with:

        python-version: '3.11'



    - name: Bağımlılıkların Yüklenmesi

      run: |

        pip install --upgrade pip

        pip install fastapi uvicorn sqlalchemy psycopg2-binary alembic "qrcode[pil]" pillow boto3 prometheus-client pydantic python-multipart httpx



    - name: Uygulamayı Başlat ve Bekle (Sağlık Kontrolü)

      env:

        DATABASE_URL: "sqlite:///./qrvault.db"

        LOCALSTACK: "true"

        AWS_ACCESS_KEY_ID: mock_key

        AWS_SECRET_ACCESS_KEY: mock_secret

        AWS_DEFAULT_REGION: us-east-1

        AWS_ENDPOINT_URL: http://localhost:4566

        LOCALSTACK_URL: http://localhost:4566

      run: |

        sudo echo "127.0.0.1 localstack" | sudo tee -a /etc/hosts

        

        uvicorn src.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &

        

        echo "FastAPI sunucusunun düzgün çalışıp çalışmadığı kontrol ediliyor..."

        for i in {1..15}; do

          if curl -s http://127.0.0.1:8000/health > /dev/null; then

            echo "FastAPI başarıyla başlatıldı ve çalışıyor!"

            break

          fi

          echo "API'den yanıt bekleniyor (deneme $i/15)..."

          sleep 2

        done



        if ! curl -s http://127.0.0.1:8000/health > /dev/null; then

          echo "HATA: FastAPI başlatılamadı. Uvicorn logları dökülüyor:"

          cat uvicorn.log

          exit 1

        fi



    # Selin Unit ve Integration testlerini bitirdiğinde, 

    # üstteki adıma "pytest" bağımlılığını ekleyip, buraya sadece aşağıdaki komutu yazması yeterli olacak:

    # - name: Selin'in Testlerini Koştur

    #   run: pytest --cov=src --cov-fail-under=70 tests/



  # 3. AŞAMA: Docker Multi-stage Build & Paketleme

  docker-build:

    needs: test # Önce test aşamasının (ve API doğrulamasının) bitmesini bekler

    runs-on: ubuntu-latest

    permissions:

      contents: read

      packages: write



    steps:

    - uses: actions/checkout@v4



    - name: Docker Buildx Kurulumu

      uses: docker/setup-buildx-action@v3



    - name: GitHub Container Registry Girişi

      uses: docker/login-action@v3

      with:

        registry: ghcr.io

        username: ${{ github.actor }}

        password: ${{ secrets.GITHUB_TOKEN }}



    - name: Docker İmajını Oluştur ve Push Et

      uses: docker/build-push-action@v5

      with:

        context: .

        file: ./Dockerfile

        push: true

        tags: |

          ghcr.io/${{ github.repository }}/qrvault:latest

          ghcr.io/${{ github.repository }}/qrvault:${{ github.sha }}



  # 4. AŞAMA: Smoke Test (Ayağa Kaldırma Kontrolü)

  smoke:

    needs: docker-build

    runs-on: ubuntu-latest



    services:

      localstack:

        image: localstack/localstack:3.4.0

        ports:

          - 4566:4566



    steps:

    - uses: actions/checkout@v4



    - name: Konfigürasyon Ayarları

      run: sudo echo "127.0.0.1 localstack" | sudo tee -a /etc/hosts



    - name: Paketlenen Docker İmajını Test Amaçlı Ayağa Kaldır

      env:

        DATABASE_URL: "sqlite:///./qrvault.db"

        LOCALSTACK: "true"

        AWS_ACCESS_KEY_ID: mock_key

        AWS_SECRET_ACCESS_KEY: mock_secret

        AWS_DEFAULT_REGION: us-east-1

      run: |

        docker run -d --name qrvault_app --network host \

          -e DATABASE_URL="$DATABASE_URL" \

          -e LOCALSTACK="$LOCALSTACK" \

          -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \

          -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \

          -e AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION" \

          -e AWS_ENDPOINT_URL="http://localhost:4566" \

          ghcr.io/${{ github.repository }}/qrvault:latest



    - name: Dağıtım Öncesi Son Sağlık Kontrolü

      run: |

        sleep 8

        curl -f http://127.0.0.1:8000/health || (docker logs qrvault_app && exit 1)



  # 5. AŞAMA: Newman Otomasyon Testleri

  newman:

    needs: smoke # En son aşama olarak çalışır

    runs-on: ubuntu-latest



    services:

      localstack:

        image: localstack/localstack:3.4.0

        ports:

          - 4566:4566



    steps:

    - uses: actions/checkout@v4



    - name: Python Kurulumu

      uses: actions/setup-python@v5

      with:

        python-version: '3.11'



    - name: Node.js Kurulumu

      uses: actions/setup-node@v4

      with:

        node-version: '18'



    - name: Bağımlılıkların ve Newman CLI'ın Kurulması

      run: |

        pip install fastapi uvicorn sqlalchemy psycopg2-binary "qrcode[pil]" pillow boto3 prometheus-client pydantic python-multipart httpx

        npm install -g newman



    - name: Newman Koleksiyonunu Koştur

      env:

        DATABASE_URL: "sqlite:///./qrvault.db"

        LOCALSTACK: "true"

        AWS_ACCESS_KEY_ID: mock_key

        AWS_SECRET_ACCESS_KEY: mock_secret

        AWS_DEFAULT_REGION: us-east-1

        AWS_ENDPOINT_URL: http://localhost:4566

      run: |

        sudo echo "127.0.0.1 localstack" | sudo tee -a /etc/hosts

        uvicorn src.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &

        

        for i in {1..15}; do

          if curl -s http://127.0.0.1:8000/health > /dev/null; then

            break

          fi

          sleep 2

        done



        newman run postman/collection.json --env-var "baseUrl=http://127.0.0.1:8000" --ignore-redirects || {

          cat uvicorn.log

          exit 1

        } 

